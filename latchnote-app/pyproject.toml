[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latchnote"
version = "0.1.0"
description = "Local Markdown notes from live course audio."
requires-python = ">=3.12"
dependencies = [
    "PyAudioWPatch>=0.2.12.8",
    "deepgram-sdk>=7.7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
